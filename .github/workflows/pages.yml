name: Deploy regression workspace to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install export dependencies
        run: pip install -r requirements-runtime.txt
      - name: Export validated datasets and frontend
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python scripts/build_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
