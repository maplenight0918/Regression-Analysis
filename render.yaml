# Explicitly free; no databases, disks, or paid services are provisioned.
services:
  - type: web
    name: regression-analysis-api-maplenight0918
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements-runtime.txt
    startCommand: python -m uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.13
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: ALLOWED_ORIGINS
        value: https://maplenight0918.github.io
